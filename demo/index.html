<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "string-diff",
  "alternateName": "@krkarma777/string-diff",
  "url": "https://krkarma777.github.io/string-diff/",
  "description": "Online text diff tool that compares two strings by word, character, or line using the Myers O(ND) shortest edit script algorithm. Zero dependencies, Unicode-safe.",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Any",
  "browserRequirements": "Requires JavaScript",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2f3d;
    --text: #e6e9f0;
    --muted: #8b91a3;
    --accent: #6ea8fe;
    --del-bg: rgba(248, 81, 73, 0.22);
    --del-text: #ffa198;
    --ins-bg: rgba(63, 185, 80, 0.22);
    --ins-text: #7ee787;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    display: flex;
    justify-content: center;
  }
  main { width: min(900px, 100%); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 code { color: var(--accent); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .inputs { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
  textarea {
    width: 100%;
    height: 140px;
    padding: 12px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 12px; margin: 16px 0 24px; flex-wrap: wrap; }
  button {
    padding: 10px 22px;
    background: var(--accent);
    color: #0b0d12;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  select {
    padding: 9px 10px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
  }
  label.opt {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    text-transform: none;
    letter-spacing: 0;
    margin: 0;
    cursor: pointer;
  }
  label.opt input { accent-color: var(--accent); }
  #time { color: var(--muted); font-size: 13px; }
  #result {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    min-height: 60px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #result .del { background: var(--del-bg); color: var(--del-text); text-decoration: line-through; border-radius: 3px; }
  #result .ins { background: var(--ins-bg); color: var(--ins-text); border-radius: 3px; }
  #result .empty { color: var(--muted); }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer code { font-family: ui-monospace, "SF Mono", Menlo, monospace; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
</style>
</head>
<body>
<main>
  <h1><code>@krkarma777/string-diff</code> demo</h1>
  <p class="sub">Compare two strings by word, character, or line — Myers O(ND) shortest-edit-script diff · typed arrays · zero dependencies</p>

  <div class="inputs">
    <div>
      <label for="a">Original</label>
      <textarea id="a">committer_list_per_month[date + '-' + log[i].author] = 1;</textarea>
    </div>
    <div>
      <label for="b">Changed</label>
      <textarea id="b">var date_author = date + '-' + log[i].author;</textarea>
    </div>
  </div>

  <div class="controls">
    <button id="compare">Compare</button>
    <select id="mode">
      <option value="word" selected>word</option>
      <option value="char">char</option>
      <option value="line">line</option>
    </select>
    <label class="opt"><input type="checkbox" id="refine"> refine</label>
    <label class="opt"><input type="checkbox" id="heuristic"> heuristic</label>
    <span id="time"></span>
  </div>

  <div id="result"><span class="empty">Press Compare to see the diff.</span></div>

  <footer>
    <a href="https://github.com/krkarma777/string-diff">GitHub</a> ·
    <a href="https://www.npmjs.com/package/@krkarma777/string-diff">npm</a> ·
    <code>npm i @krkarma777/string-diff</code> · MIT
  </footer>
</main>

<script src="./string-diff.min.js"></script>
<script>
  const $ = id => document.getElementById(id);

  function render() {
    const a = $('a').value;
    const b = $('b').value;
    const mode = $('mode').value;
    const refine = $('refine').checked;
    const heuristic = $('heuristic').checked;

    const t0 = performance.now();
    const entries = StringDiff.diff(a, b, { mode, refine, heuristic });
    const elapsed = performance.now() - t0;

    const result = $('result');
    result.textContent = '';
    if (entries.length === 0) {
      const span = document.createElement('span');
      span.className = 'empty';
      span.textContent = 'Both strings are empty.';
      result.appendChild(span);
    }
    for (const entry of entries) {
      const span = document.createElement('span');
      if (entry.operation === 'delete') span.className = 'del';
      else if (entry.operation === 'insert') span.className = 'ins';
      span.textContent = entry.text;
      result.appendChild(span);
    }
    $('time').textContent = `diff computed in ${elapsed.toFixed(2)} ms`;
  }

  $('compare').addEventListener('click', render);
</script>
</body>
</html>
