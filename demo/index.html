<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@krkarma777/string-diff — demo</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2f3d;
    --text: #e6e9f0;
    --muted: #8b91a3;
    --accent: #6ea8fe;
    --del-bg: rgba(248, 81, 73, 0.22);
    --del-text: #ffa198;
    --ins-bg: rgba(63, 185, 80, 0.22);
    --ins-text: #7ee787;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    display: flex;
    justify-content: center;
  }
  main { width: min(900px, 100%); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 code { color: var(--accent); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .inputs { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
  textarea {
    width: 100%;
    height: 140px;
    padding: 12px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 12px; margin: 16px 0 24px; flex-wrap: wrap; }
  button {
    padding: 10px 22px;
    background: var(--accent);
    color: #0b0d12;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  select {
    padding: 9px 10px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
  }
  #time { color: var(--muted); font-size: 13px; }
  #result {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    min-height: 60px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #result .del { background: var(--del-bg); color: var(--del-text); text-decoration: line-through; border-radius: 3px; }
  #result .ins { background: var(--ins-bg); color: var(--ins-text); border-radius: 3px; }
  #result .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1><code>@krkarma777/string-diff</code> demo</h1>
  <p class="sub">Myers O(ND) shortest-edit-script diff · token interning · typed arrays · zero dependencies</p>

  <div class="inputs">
    <div>
      <label for="a">Original</label>
      <textarea id="a">committer_list_per_month[date + '-' + log[i].author] = 1;</textarea>
    </div>
    <div>
      <label for="b">Changed</label>
      <textarea id="b">var date_author = date + '-' + log[i].author;</textarea>
    </div>
  </div>

  <div class="controls">
    <button id="compare">Compare</button>
    <select id="mode">
      <option value="word" selected>word</option>
      <option value="char">char</option>
      <option value="line">line</option>
    </select>
    <span id="time"></span>
  </div>

  <div id="result"><span class="empty">Press Compare to see the diff.</span></div>
</main>

<script src="../dist/string-diff.min.js"></script>
<script>
  const $ = id => document.getElementById(id);

  function render() {
    const a = $('a').value;
    const b = $('b').value;
    const mode = $('mode').value;

    const t0 = performance.now();
    const entries = StringDiff.diff(a, b, { mode });
    const elapsed = performance.now() - t0;

    const result = $('result');
    result.textContent = '';
    if (entries.length === 0) {
      const span = document.createElement('span');
      span.className = 'empty';
      span.textContent = 'Both strings are empty.';
      result.appendChild(span);
    }
    for (const entry of entries) {
      const span = document.createElement('span');
      if (entry.operation === 'delete') span.className = 'del';
      else if (entry.operation === 'insert') span.className = 'ins';
      span.textContent = entry.text;
      result.appendChild(span);
    }
    $('time').textContent = `diff computed in ${elapsed.toFixed(2)} ms`;
  }

  $('compare').addEventListener('click', render);
</script>
</body>
</html>
